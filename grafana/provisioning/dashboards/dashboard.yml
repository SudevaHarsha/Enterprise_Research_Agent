# ECRKE Grafana dashboard provisioning (task_013, design doc §14).
# Single-file dashboard mounted at /var/lib/grafana/dashboards/dashboard.json.
apiVersion: 1

providers:
  - name: ecrke
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
