services:
  # ── API + Dashboard ──────────────────────────────────────────────────
  - type: web
    name: ecrke-api
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL_CHEAP
        value: gemini/gemini-3.1-flash-lite
      - key: LLM_MODEL_STRONG
        value: gemini/gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false  # set manually in Render dashboard
      - key: LLM_GOOGLE_API_KEY
        sync: false  # set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # set manually in Render dashboard
      - key: SEARCH_PROVIDER
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: ecrke-db
          property: connectionString
      - key: BLOB_STORE_DIR
        value: /opt/render/project/.blobs
    disk:
      name: blobs
      mountPath: /opt/render/project/.blobs
      sizeGB: 1

  # ── Background Worker (runs pipeline jobs) ───────────────────────────
  - type: worker
    name: ecrke-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: prefect worker start --pool research
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL_CHEAP
        value: gemini/gemini-3.1-flash-lite
      - key: LLM_MODEL_STRONG
        value: gemini/gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: LLM_GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: ecrke-db
          property: connectionString
      - key: PREFECT_API_URL
        sync: false  # set to the Prefect server URL or leave blank for ephemeral
      - key: BLOB_STORE_DIR
        value: /opt/render/project/.blobs
    disk:
      name: blobs
      mountPath: /opt/render/project/.blobs
      sizeGB: 1

databases:
  - name: ecrke-db
    databaseName: ecrke
    user: ecrke
    plan: free
    ipAllowList: []  # only accessible from Render private network
