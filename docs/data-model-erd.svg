<?xml version="1.0" encoding="UTF-8"?>
<!-- ECRKE data model ERD (task_015). Mirrors docs/data-model-erd.mmd (canonical).
     Hand-crafted SVG fallback: rendered PNG requires a network-enabled
     environment: npx @mermaid-js/mermaid-cli -i docs/data-model-erd.mmd -o docs/data-model-erd.png
     Red boxes = append-only (evidence_links, audit_trace). 14 tables. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" font-family="Segoe UI, Arial, sans-serif">
