      .tblRowText { font-size: 10.5px; fill: #0f172a; }
      .tblRowTextKey { font-size: 10.5px; fill: #0f172a; font-weight: bold; }
      .rel { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#earrow); }
      .relLabel { font-size: 9.5px; fill: #475569; font-style: italic; }
      .appendTag { font-size: 9px; fill: #b91c1c; font-weight: bold; }
      .legend { font-size: 10.5px; fill: #334155; }
    </style>
