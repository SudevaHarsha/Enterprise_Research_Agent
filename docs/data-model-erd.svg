  <!-- ============ LEGEND ============ -->
  <rect class="tbl" x="40" y="800" width="1180" height="62" fill="#f8fafc"/>
  <text class="legend" x="56" y="820">Legend — solid arrows are FK relationships (cardinality labeled). Red header = APPEND-ONLY table (enforced by ORM listeners in app/db/base.py + Postgres triggers; versioning by new rows, never in-place mutation).</text>
  <text class="legend" x="56" y="838">kv_cache is standalone (repeat-call cache replacing Redis; serves any run). Select attributes shown — complete column lists in docs/data-model-erd.mmd and app/db/models.py.</text>
  <text class="legend" x="56" y="856">Guarantees: no statement enters the KB unverified (draft → verified | quarantined); every conclusion links to evidence (conclusion_evidence); traceability statement → passage → source in ≤ 1 hop per edge.</text>
