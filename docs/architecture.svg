<?xml version="1.0" encoding="UTF-8"?>
<!-- ECRKE layered architecture (task_015). Mirrors docs/architecture.mmd.
     Hand-crafted SVG fallback: rendered PNG requires a network-enabled
     environment: npx @mermaid-js/mermaid-cli -i docs/architecture.mmd -o docs/architecture.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="980" viewBox="0 0 1140 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
    </marker>
    <style>
      .layer { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .layerTitle { font-size: 14px; font-weight: bold; fill: #0f172a; }
      .layerText { font-size: 12px; fill: #334155; }
      .arrowSolid { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrowDash { stroke: #0369a1; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowDash); }
      .label { font-size: 11px; fill: #475569; font-style: italic; }
      .labelBlue { font-size: 11px; fill: #0369a1; font-style: italic; }
    </style>
  </defs>

  <!-- L1 Client / Evaluator -->
  <rect class="layer" x="50" y="20" width="1000" height="80"/>
  <text class="layerTitle" x="70" y="45">L1 — Client / Evaluator</text>
  <text class="layerText" x="70" y="70">Evaluator / auditor — REST client · curl · browser (OpenAPI docs)</text>
  <text class="layerText" x="70" y="88">Submit a new question, observe the 10-stage pipeline, trace conclusions to source passages.</text>

  <line class="arrowSolid" x1="550" y1="100" x2="550" y2="138"/>
  <text class="label" x="560" y="124">submit / poll / trace</text>

  <!-- L2 API / Control -->
  <rect class="layer" x="50" y="140" width="1000" height="120"/>
  <text class="layerTitle" x="70" y="165">L2 — API / Control Layer (FastAPI + Pydantic v2)</text>
  <text class="layerText" x="70" y="187">POST /v1/runs · GET /v1/runs/{id} · GET /v1/runs/{id}/stages · GET /v1/runs/{id}/conclusions</text>
  <text class="layerText" x="70" y="205">GET /v1/statements/{id}/trace · GET /v1/runs/{id}/contradictions · GET /v1/runs/{id}/report</text>
  <text class="layerText" x="70" y="223">POST /v1/runs/{id}/resume · GET /v1/kb/search · GET /v1/runs/{id}/audit</text>
  <text class="layerText" x="70" y="241">/healthz · /readyz · /metrics — RFC 7807 errors · tenant scoping (X-Tenant-ID) · no LLM calls in the API</text>

  <line class="arrowSolid" x1="550" y1="260" x2="550" y2="288"/>
  <text class="label" x="560" y="278">create / resume run</text>

  <!-- L3 Orchestration -->
  <rect class="layer" x="50" y="290" width="1000" height="120"/>
  <text class="layerTitle" x="70" y="315">L3 — Orchestration / Execution (Prefect 3 DAG)</text>
  <text class="layerText" x="70" y="337">research_pipeline — 10 stages: define → search → collect → store → extract → verify → find → detect → conclude → trace</text>
  <text class="layerText" x="70" y="355">Checkpoints (resume) · circuit breaker · cost meter · retries · per-stage budgets (G-03)</text>
  <text class="layerText" x="70" y="373">Durable background jobs (Postgres-backed queue, no Redis) — never blocking a request thread</text>
  <text class="layerText" x="70" y="391">LangGraph agentic loops run inside retrieval and verification, in per-subtask isolation</text>

  <line class="arrowSolid" x1="300" y1="410" x2="300" y2="438"/>
  <text class="label" x="310" y="428">stage tasks</text>
  <line class="arrowSolid" x1="800" y1="410" x2="800" y2="438"/>
  <text class="label" x="810" y="428">stage tasks</text>

  <!-- L4a Retrieval / Collection -->
  <rect class="layer" x="50" y="440" width="480" height="160"/>
  <text class="layerTitle" x="70" y="465">L4a — Retrieval / Collection</text>
  <text class="layerText" x="70" y="489">Agentic retrieval loop (LangGraph)</text>
  <text class="layerText" x="70" y="507">search API + RSS + direct URL connectors</text>
  <text class="layerText" x="70" y="525">egress allowlist — default deny (G-06)</text>
  <text class="layerText" x="70" y="543">fetcher + normalizer (HTML/PDF/DOCX/RTF)</text>
  <text class="layerText" x="70" y="561">content-hash dedupe · redaction hooks (G-05)</text>
  <text class="layerText" x="70" y="579">unsafe-content filter (G-04)</text>

  <!-- L4b Verification / Audit -->
  <rect class="layer" x="570" y="440" width="480" height="160"/>
  <text class="layerTitle" x="590" y="465">L4b — Verification / Audit</text>
  <text class="layerText" x="590" y="489">Verify-first gate (G-02): deterministic</text>
  <text class="layerText" x="590" y="507">support-matrix scorer + LLM judge (strong tier)</text>
  <text class="layerText" x="590" y="525">draft → verified | quarantined (G-11 output validation)</text>
  <text class="layerText" x="590" y="543">Contradictions: flag-first → confirm-second</text>
  <text class="layerText" x="590" y="561">Conclude: verified-only + evidence links</text>
  <text class="layerText" x="590" y="579">one-sidedness check (G-07 human-review flag)</text>

  <line class="arrowSolid" x1="290" y1="600" x2="290" y2="648"/>
  <text class="label" x="300" y="628">sources + passages</text>
  <line class="arrowSolid" x1="810" y1="600" x2="810" y2="648"/>
  <text class="label" x="800" y="628" text-anchor="end">verified · contradictions · conclusions</text>

  <!-- L5 Storage -->
  <rect class="layer" x="50" y="650" width="1000" height="130"/>
  <text class="layerTitle" x="70" y="675">L5 — Knowledge / Storage (PostgreSQL 16, single ACID source of truth)</text>
  <text class="layerText" x="70" y="699">Provenance core: tenants · runs · sources · passages · statements</text>
  <text class="layerText" x="70" y="717">evidence_links (append-only) · findings · contradictions · conclusions</text>
  <text class="layerText" x="70" y="735">audit_trace (append-only) · checkpoints · kv_cache</text>
  <text class="layerText" x="70" y="753">Provenance is a data model, not a topology — every conclusion resolves to a stored passage in ≤ 1 hop</text>
  <text class="layerText" x="70" y="771">ORM + DB-level append-only enforcement (belt-and-braces); migrations via Alembic</text>

  <!-- L6 Observability -->
  <rect class="layer" x="50" y="820" width="1000" height="100"/>
  <text class="layerTitle" x="70" y="845">L6 — Observability</text>
  <text class="layerText" x="70" y="869">JSONL lifecycle events → Prometheus → Grafana (observability compose profile)</text>
  <text class="layerText" x="70" y="887">OTel spans (per run/stage/tool call) · /metrics — 10 ecrke_ instruments</text>
  <text class="layerText" x="70" y="905">Prefect server (Postgres-backed queue) · Eval harness (365 tests) wired into CI = gate of record</text>

  <!-- Dashed observability bus: L3 -> L6 (right margin) -->
  <path class="arrowDash" d="M1050,350 L1090,350 L1090,870 L1056,870"/>
  <text transform="rotate(90 1100 610)" x="1100" y="610" text-anchor="middle" class="labelBlue">JSONL events · OTel spans · Prometheus → Grafana</text>

  <!-- Dashed scrape: L6 -> L2 (left margin) -->
  <path class="arrowDash" d="M50,870 L20,870 L20,200 L48,200"/>
  <text transform="rotate(270 12 540)" x="12" y="540" text-anchor="middle" class="labelBlue">Prometheus scrape /metrics</text>
</svg>
