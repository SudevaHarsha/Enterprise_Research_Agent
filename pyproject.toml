[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecrke"
version = "0.1.0"
description = "Evidence-Centric Research Knowledge Engine (ECRKE) - enterprise AI research agent with statement-level provenance, verify-first audit layer, and reusable knowledge base."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ECRKE" }]
keywords = ["research", "knowledge-base", "llm", "provenance", "audit", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

dependencies = [
    # API / control layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Storage / data access (relational provenance core)
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    # Orchestration & agentic loops
    "prefect>=3.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # LLM access (provider-agnostic gateway + cost tracking)
    "litellm>=1.50",
    "tiktoken>=0.8",
    # Retrieval / collection
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "markdownify>=0.13",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "striprtf>=0.0.26",
    "ddgs>=9.0",
    # Structured output / performance
    "orjson>=3.10",
    # Observability
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21",
    # Reliability
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "psycopg2-binary>=2.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
]
dlp = [
    "presidio-analyzer>=2.2",
]
local = [
    "ollama>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/versions/*" = ["E501"]
# License generator embeds long markdown table/prose rows that must stay
# single-line (task_015) — same justification as alembic migrations.
"scripts/generate_licenses.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
